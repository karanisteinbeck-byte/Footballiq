<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#071a12">

    <title>Football IQ</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- App icon -->
    <link
        rel="apple-touch-icon"
        href="icon-192.png"
    >

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         GAME CANVAS
         ===================================================== -->

    <canvas id="gameCanvas"></canvas>


    <!-- =====================================================
         START SCREEN
         ===================================================== -->

    <div id="startScreen" class="screen">

        <div class="menu-card">

            <h1>FOOTBALL IQ</h1>

            <p class="subtitle">
                Train your football intelligence
            </p>

            <button id="startButton" class="menu-button">
                START TRAINING
            </button>

            <button id="settingsButton" class="menu-button secondary">
                SETTINGS
            </button>

        </div>

    </div>


    <!-- =====================================================
         SETTINGS SCREEN
         ===================================================== -->

    <div id="settingsScreen" class="screen hidden">

        <div class="menu-card">

            <h2>SETTINGS</h2>


            <div class="setting-row">

                <span>Offside</span>

                <button id="offsideButton" class="setting-button">
                    ON
                </button>

            </div>


            <div class="setting-row">

                <span>Offside Rings</span>

                <button id="ringsButton" class="setting-button">
                    ON
                </button>

            </div>


            <div class="setting-row">

                <span>Teammates</span>

                <div class="counter">

                    <button id="teamMinus">−</button>

                    <span id="teamCount">6</span>

                    <button id="teamPlus">+</button>

                </div>

            </div>


            <div class="setting-row">

                <span>Opponents</span>

                <div class="counter">

                    <button id="opponentMinus">−</button>

                    <span id="opponentCount">7</span>

                    <button id="opponentPlus">+</button>

                </div>

            </div>


            <button
                id="settingsBack"
                class="menu-button secondary"
            >
                BACK
            </button>

        </div>

    </div>


    <!-- =====================================================
         GAME HUD
         ===================================================== -->

    <div id="gameHUD">

        <div id="scenarioNumber">
            SCENARIO 1
        </div>

        <div id="instruction">
            TAP A TEAMMATE TO PASS
        </div>

    </div>


    <!-- =====================================================
         RESULT SCREEN
         ===================================================== -->

    <div id="resultScreen" class="screen hidden">

        <div class="menu-card result-card">

            <h2 id="resultMessage">
                RESULT
            </h2>


            <div class="overall-container">

                <div class="overall-label">
                    SCORE
                </div>

                <div id="overallScore">
                    0
                </div>

            </div>


            <div class="score-row">

                <span>Decision</span>

                <span id="decisionScore">
                    0
                </span>

            </div>


            <div class="score-row">

                <span>Timing</span>

                <span id="timingScore">
                    0
                </span>

            </div>


            <div class="score-row">

                <span>Reaction Time</span>

                <span id="decisionTime">
                    0.00s
                </span>

            </div>


            <p id="analysis">
                Analysis
            </p>


            <button
                id="nextButton"
                class="menu-button"
            >
                NEXT SCENARIO
            </button>

        </div>

    </div>


    <!-- =====================================================
         SERVICE WORKER
         ===================================================== -->

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("sw.js")
                    .then(function () {
                        console.log("Service worker registered");
                    })
                    .catch(function (error) {
                        console.log(
                            "Service worker registration failed:",
                            error
                        );
                    });
            });
        }
    </script>


    <!-- =====================================================
         GAME JAVASCRIPT
         IMPORTANT: THIS IS THE ONLY GAME.JS SCRIPT
         ===================================================== -->

    <script src="game.js"></script>

</body>
</html>
